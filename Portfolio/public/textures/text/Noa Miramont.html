.loader {
    position: absolute;

    left: 50%;

    font-weight: bold;
    font-family: monospace;
    font-size: 30px;

    animation: animateBar 3s infinite;
  }

    content: "Loading...";
  }

      80%  {text-shadow:    0  0 0 #ffffff,10ch 0 0 #ffffff;background-size:100% 3px}

  }
